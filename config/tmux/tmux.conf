# Default shell placeholder (configured by Gentleman.Dots installer)
set -g default-command "/opt/homebrew/bin/fish"
set -g default-shell "/opt/homebrew/bin/fish"

# Carga TPM
set -g @plugin 'tmux-plugins/tpm'

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Floating window
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  # open in the same directory of the current pane
  display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

# Tema Kanagawa
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-plugins "git cpu-usage ram-usage"
set -g @kanagawa-ignore-window-colors true

# --- terminal & key handling ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

set -s extended-keys off

# Copy-mode: emacs bindings (default). Use Ctrl-Space to start selection,
# Alt-w to copy, or just enable mouse drag.
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip"'

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# --- Pane management without prefix (alt as leader) ---
# Replaces Ghostty's native splits so open-at-cwd can resolve the focused
# pane via tmux (Ghostty splits all share one PID and can't be told apart
# from outside the app).
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-h split-window -v -c "#{pane_current_path}"

# Close the active pane (was Ghostty's alt+s, which killed the whole window)
bind -n M-s kill-pane

# Pane navigation (matches Ghostty's previous alt+arrows muscle memory)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Pane zoom toggle (was Ghostty's alt+z)
bind -n M-z resize-pane -Z

# Pane resize (ctrl+shift+arrows)
bind -n C-S-Left  resize-pane -L 5
bind -n C-S-Right resize-pane -R 5
bind -n C-S-Up    resize-pane -U 5
bind -n C-S-Down  resize-pane -D 5

# Mouse support
set -g mouse on

# Status bar position
set -g status-position top

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1

# TPM init
run '~/.tmux/plugins/tpm/tpm'
