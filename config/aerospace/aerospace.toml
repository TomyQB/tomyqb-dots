# AeroSpace config — i3-style minimal setup
# Docs: https://nikitabobko.github.io/AeroSpace/guide

# Start AeroSpace at login
start-at-login = true

# Normalizations help when apps create unexpected nested containers
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout for new containers
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus / focus follows mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps between windows and screen edges
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# 'main' binding mode — the default one
[mode.main.binding]

# --- Layout ---
alt-slash    = 'layout tiles horizontal vertical'
alt-enter    = 'layout accordion tiles'
alt-shift-m  = 'fullscreen'

# --- Window management ---
alt-w = 'close --quit-if-last-window'

# --- App launchers (open-at-cwd opens at the focused terminal's CWD) ---
alt-f = 'exec-and-forget $HOME/.config/aerospace/open-at-cwd.sh finder'
alt-q = 'exec-and-forget open -na Warp'
alt-g = 'exec-and-forget $HOME/.config/aerospace/open-chrome.sh'

# --- Focus window (alt+shift+hjkl horizontal, arrows vertical) ---
# alt+arrows queda libre para que Warp navegue entre splits
alt-shift-j     = 'focus left'
alt-shift-down  = 'focus down'
alt-shift-up    = 'focus up'
alt-shift-l     = 'focus right'

# --- Move window (alt+ctrl + j/l horizontal, i/k vertical) ---
alt-ctrl-j = 'move left'
alt-ctrl-l = 'move right'
alt-ctrl-i = 'move up'
alt-ctrl-k = 'move down'

# --- Resize ---
alt-minus  = 'resize smart -50'
alt-equal  = 'resize smart +50'

# --- Workspaces (alt+1,3..9,0) — alt-2 reservado para teclear '@' ---
# El workspace siempre sigue al monitor enfocado (focus-workspace-here.sh).
alt-1 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 1'
alt-3 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 3'
alt-4 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 4'
alt-5 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 5'
alt-6 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 6'
alt-7 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 7'
alt-8 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 8'
alt-9 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 9'
alt-0 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 10'

# --- Move window to workspace (workspace destino también sigue al monitor) ---
alt-shift-1 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 1 --move'
alt-shift-3 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 3 --move'
alt-shift-4 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 4 --move'
alt-shift-5 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 5 --move'
alt-shift-6 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 6 --move'
alt-shift-7 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 7 --move'
alt-shift-8 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 8 --move'
alt-shift-9 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 9 --move'
alt-shift-0 = 'exec-and-forget $HOME/.config/aerospace/focus-workspace-here.sh 10 --move'

# --- Monitor / workspace navigation ---
alt-tab       = 'focus-monitor --wrap-around next'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- Service mode (config reload, etc.) ---
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc          = ['reload-config', 'mode main']
r            = ['flatten-workspace-tree', 'mode main']  # reset layout
f            = ['layout floating tiling', 'mode main']  # toggle floating
backspace    = ['close-all-windows-but-current', 'mode main']

# --- Per-app rules ---
# Finder always floats so alt+f opens it as a floating window.
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

# System Settings should also float (small dialogs).
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'
