# AeroSpace config — i3-style minimal setup
# Docs: https://nikitabobko.github.io/AeroSpace/guide

# Start AeroSpace at login
start-at-login = true

# Normalizations help when apps create unexpected nested containers
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout for new containers
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus / focus follows mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps between windows and screen edges
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# 'main' binding mode — the default one
[mode.main.binding]

# --- Layout ---
alt-slash    = 'layout tiles horizontal vertical'
alt-enter    = 'layout accordion tiles'
alt-shift-m  = 'fullscreen'

# --- Window management ---
alt-w = 'close --quit-if-last-window'

# --- App launchers (open-at-cwd opens at the focused terminal's CWD) ---
alt-f = 'exec-and-forget $HOME/.config/aerospace/open-at-cwd.sh finder'
alt-c = 'exec-and-forget $HOME/.config/aerospace/open-at-cwd.sh vscode'
alt-q = 'exec-and-forget open -na Ghostty'
alt-b = '''exec-and-forget osascript -e 'tell application "Google Chrome" to make new window' -e 'tell application "Google Chrome" to activate' '''
alt-d = 'exec-and-forget $HOME/.config/aerospace/toggle-lazydocker.sh'

# --- Focus window (alt+shift+arrows) ---
# alt+arrows queda libre para que Ghostty navegue entre splits
alt-shift-left  = 'focus left'
alt-shift-down  = 'focus down'
alt-shift-up    = 'focus up'
alt-shift-right = 'focus right'

# --- Move window (alt+ctrl+arrows) ---
alt-ctrl-left  = 'move left'
alt-ctrl-down  = 'move down'
alt-ctrl-up    = 'move up'
alt-ctrl-right = 'move right'

# --- Resize ---
alt-minus  = 'resize smart -50'
alt-equal  = 'resize smart +50'

# --- Workspaces (alt+1,3..9,0) — alt-2 reservado para teclear '@' ---
alt-1 = 'workspace 1'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# --- Move window to workspace ---
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

# --- Workspace navigation ---
alt-tab       = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- Service mode (config reload, etc.) ---
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc          = ['reload-config', 'mode main']
r            = ['flatten-workspace-tree', 'mode main']  # reset layout
f            = ['layout floating tiling', 'mode main']  # toggle floating
backspace    = ['close-all-windows-but-current', 'mode main']

# --- Per-app rules ---
# Finder always floats so alt+f opens it as a floating window.
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

# System Settings should also float (small dialogs).
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'
